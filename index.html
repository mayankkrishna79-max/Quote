<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#0f172a">

<meta name="description"
content="Create social media ready quotes for Instagram, WhatsApp Status and YouTube Shorts.">

<link rel="manifest" href="manifest.json">

<title>Social Quote Maker</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap');

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
background:#020617;
color:#fff;
font-family:Inter,Arial,sans-serif;
}

body{
min-height:100vh;
}

button,input,textarea,select{
font-family:inherit;
}

.app{
min-height:100vh;
display:flex;
flex-direction:column;
}

/* HEADER */

.header{
height:60px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
background:#111827;
border-bottom:1px solid #273449;
position:sticky;
top:0;
z-index:100;
}

.logo{
font-size:18px;
font-weight:800;
}

.install{
display:none;
width:auto;
margin:0;
padding:8px 12px;
background:#2563eb;
color:#fff;
border:0;
border-radius:9px;
font-weight:700;
}

/* MAIN */

.main{
display:flex;
min-height:calc(100vh - 60px);
}

/* CONTROLS */

.controls{
width:350px;
padding:16px;
background:#111827;
overflow-y:auto;
}

.section{
margin-bottom:18px;
}

.section-title{
color:#94a3b8;
font-size:11px;
font-weight:800;
text-transform:uppercase;
letter-spacing:1px;
margin-bottom:8px;
}

textarea,
input,
select{
width:100%;
background:#1e293b;
border:1px solid #334155;
color:#fff;
border-radius:10px;
padding:11px;
outline:none;
}

textarea{
height:105px;
resize:none;
}

textarea:focus,
input:focus,
select:focus{
border-color:#3b82f6;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
}

label{
display:block;
color:#cbd5e1;
font-size:12px;
margin-bottom:5px;
}

button{
width:100%;
border:0;
border-radius:10px;
padding:12px;
color:white;
font-weight:700;
font-size:14px;
cursor:pointer;
}

button:active{
transform:scale(.98);
}

.primary{
background:#2563eb;
}

.success{
background:#16a34a;
}

.secondary{
background:#334155;
}

/* FORMAT PRESETS */

.presets{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.preset{
background:#1e293b;
border:1px solid #334155;
padding:10px 5px;
}

.preset small{
display:block;
color:#94a3b8;
font-size:10px;
margin-top:3px;
}

.preset.active{
background:#1d4ed8;
border-color:#60a5fa;
}

/* BACKGROUNDS */

.backgrounds{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px;
}

.bg{
height:43px;
padding:0;
border:2px solid transparent;
}

.bg.active{
border-color:#fff;
}

/* COLORS */

input[type="color"]{
height:42px;
padding:3px;
}

input[type="range"]{
width:100%;
accent-color:#3b82f6;
}

.range-value{
float:right;
color:#60a5fa;
}

/* PREVIEW */

.preview{
flex:1;
min-width:0;
display:flex;
justify-content:center;
align-items:center;
padding:25px;
background:#020617;
overflow:auto;
}

/* CANVAS */

.canvas{
position:relative;
width:360px;
height:640px;
flex-shrink:0;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
border-radius:6px;
background:linear-gradient(135deg,#111827,#1d4ed8);
box-shadow:0 25px 80px rgba(0,0,0,.6);
}

.canvas:before{
content:"";
position:absolute;
width:480px;
height:480px;
border-radius:50%;
background:rgba(255,255,255,.07);
top:-230px;
right:-170px;
}

.canvas:after{
content:"";
position:absolute;
width:350px;
height:350px;
border-radius:50%;
background:rgba(255,255,255,.05);
bottom:-190px;
left:-140px;
}

/* SAFE AREA */

.safe-zone{
position:absolute;
left:8%;
right:8%;
top:16%;
bottom:18%;
z-index:3;
pointer-events:none;
border:1px dashed rgba(255,255,255,.18);
border-radius:10px;
}

/* CONTENT */

.content{
width:78%;
text-align:center;
position:relative;
z-index:5;
}

.quote-mark{
font-family:Georgia,serif;
font-size:55px;
line-height:.5;
opacity:.4;
margin-bottom:20px;
}

.quote{
font-family:"Noto Sans Devanagari",Arial,sans-serif;
font-size:26px;
font-weight:700;
line-height:1.45;
overflow-wrap:break-word;
}

.author{
margin-top:24px;
font-size:15px;
opacity:.9;
}

.brand{
position:absolute;
z-index:6;
bottom:35px;
left:0;
right:0;
text-align:center;
font-size:10px;
letter-spacing:1.5px;
opacity:.75;
}

/* SAFE SWITCH */

.safe-control{
display:flex;
align-items:center;
justify-content:space-between;
background:#1e293b;
border-radius:10px;
padding:10px 12px;
}

.safe-control span{
font-size:12px;
}

.switch{
width:42px;
height:23px;
appearance:none;
background:#475569;
border-radius:20px;
position:relative;
cursor:pointer;
padding:0;
}

.switch:before{
content:"";
position:absolute;
width:17px;
height:17px;
border-radius:50%;
background:#fff;
top:3px;
left:3px;
transition:.2s;
}

.switch:checked{
background:#2563eb;
}

.switch:checked:before{
left:22px;
}

/* STATUS */

.status{
font-size:11px;
color:#94a3b8;
text-align:center;
margin-top:8px;
min-height:16px;
}

/* MOBILE */

@media(max-width:800px){

.main{
flex-direction:column;
}

.preview{
order:1;
min-height:calc(100vh - 60px);
padding:12px 5px;
}

.controls{
order:2;
width:100%;
}

.canvas{
width:88vw;
height:calc(88vw * 1.777777);
max-width:360px;
max-height:640px;
}

}

</style>
</head>

<body>

<div class="app">

<header class="header">

<div class="logo">
✨ Social Quote Maker
</div>

<button
id="installButton"
class="install">
Install App
</button>

</header>


<main class="main">

<!-- CONTROLS -->

<section class="controls">

<!-- QUOTE -->

<div class="section">

<div class="section-title">
Quote
</div>

<textarea id="quoteInput">सफलता उन्हीं लोगों को मिलती है जो लगातार प्रयास करते रहते हैं।</textarea>

</div>


<!-- AUTHOR -->

<div class="section">

<div class="section-title">
Author
</div>

<input
id="authorInput"
value="अज्ञात">

</div>


<!-- BRAND -->

<div class="section">

<div class="section-title">
Brand
</div>

<input
id="brandInput"
value="QUOTE MAKER">

</div>


<!-- SOCIAL FORMAT -->

<div class="section">

<div class="section-title">
Social Media Format
</div>

<div class="presets">

<button
class="preset active"
data-width="1080"
data-height="1920"
data-name="Instagram-WhatsApp-Shorts">

Instagram / WhatsApp / Shorts

<small>
1080 × 1920 • 9:16
</small>

</button>


<button
class="preset"
data-width="1080"
data-height="1350"
data-name="Instagram-Portrait">

Instagram Portrait

<small>
1080 × 1350 • 4:5
</small>

</button>


<button
class="preset"
data-width="1080"
data-height="1080"
data-name="Instagram-Square">

Instagram Square

<small>
1080 × 1080 • 1:1
</small>

</button>


<button
class="preset"
data-width="1080"
data-height="1440"
data-name="Portrait">

Portrait

<small>
1080 × 1440
</small>

</button>

</div>

</div>


<!-- FONT SIZE -->

<div class="section">

<div class="section-title">
Font Size
</div>

<label>

Size

<span
id="fontValue"
class="range-value">
26
</span>

</label>

<input
id="fontSize"
type="range"
min="16"
max="55"
value="26">

</div>


<!-- COLORS -->

<div class="section">

<div class="section-title">
Colors
</div>

<div class="row">

<div>

<label>
Text
</label>

<input
id="textColor"
type="color"
value="#ffffff">

</div>


<div>

<label>
Background
</label>

<input
id="backgroundColor"
type="color"
value="#111827">

</div>

</div>

</div>


<!-- BACKGROUNDS -->

<div class="section">

<div class="section-title">
Background Style
</div>

<div class="backgrounds">

<button
class="bg active"
data-bg="linear-gradient(135deg,#111827,#1d4ed8)"
style="background:linear-gradient(135deg,#111827,#1d4ed8)">
</button>

<button
class="bg"
data-bg="linear-gradient(135deg,#7c2d12,#db2777)"
style="background:linear-gradient(135deg,#7c2d12,#db2777)">
</button>

<button
class="bg"
data-bg="linear-gradient(135deg,#064e3b,#15803d)"
style="background:linear-gradient(135deg,#064e3b,#15803d)">
</button>

<button
class="bg"
data-bg="linear-gradient(135deg,#312e81,#9333ea)"
style="background:linear-gradient(135deg,#312e81,#9333ea)">
</button>

<button
class="bg"
data-bg="#020617"
style="background:#020617">
</button>

<button
class="bg"
data-bg="#fef3c7"
style="background:#fef3c7">
</button>

<button
class="bg"
data-bg="linear-gradient(135deg,#450a0a,#dc2626)"
style="background:linear-gradient(135deg,#450a0a,#dc2626)">
</button>

<button
class="bg"
data-bg="linear-gradient(135deg,#082f49,#0891b2)"
style="background:linear-gradient(135deg,#082f49,#0891b2)">
</button>

</div>

</div>


<!-- SAFE AREA -->

<div class="section">

<div class="safe-control">

<span>
Show Social Safe Area
</span>

<input
id="safeToggle"
class="switch"
type="checkbox"
checked>

</div>

</div>


<!-- ACTIONS -->

<div class="section">

<button
class="secondary"
onclick="randomQuote()">
🎲 Random Quote
</button>

<br><br>

<button
class="success"
onclick="downloadImage()">
⬇️ Download Selected Format
</button>

<br><br>

<button
class="primary"
onclick="shareImage()">
📤 Share Selected Format
</button>

<div
id="status"
class="status">
1080 × 1920 selected
</div>

</div>

</section>


<!-- PREVIEW -->

<section class="preview">

<div
id="canvas"
class="canvas">

<div
id="safeZone"
class="safe-zone">
</div>


<div class="content">

<div class="quote-mark">
“
</div>

<div
id="quote"
class="quote">
सफलता उन्हीं लोगों को मिलती है जो लगातार प्रयास करते रहते हैं।
</div>

<div
id="author"
class="author">
— अज्ञात
</div>

</div>


<div
id="brand"
class="brand">
QUOTE MAKER
</div>

</div>

</section>

</main>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const canvas =
document.getElementById("canvas");

const quoteInput =
document.getElementById("quoteInput");

const authorInput =
document.getElementById("authorInput");

const brandInput =
document.getElementById("brandInput");

const quote =
document.getElementById("quote");

const author =
document.getElementById("author");

const brand =
document.getElementById("brand");

const fontSize =
document.getElementById("fontSize");

const fontValue =
document.getElementById("fontValue");

const textColor =
document.getElementById("textColor");

const backgroundColor =
document.getElementById("backgroundColor");

const safeZone =
document.getElementById("safeZone");

const safeToggle =
document.getElementById("safeToggle");

const status =
document.getElementById("status");


/* =====================================================
   SELECTED EXPORT FORMAT
===================================================== */

let exportWidth = 1080;

let exportHeight = 1920;

let exportName =
"Instagram-WhatsApp-Shorts";


/* =====================================================
   UPDATE TEXT
===================================================== */

quoteInput.addEventListener(
"input",
() => {

quote.textContent =
quoteInput.value;

});


authorInput.addEventListener(
"input",
() => {

author.textContent =
authorInput.value
? "— " + authorInput.value
: "";

});


brandInput.addEventListener(
"input",
() => {

brand.textContent =
brandInput.value;

});


/* =====================================================
   FONT SIZE
===================================================== */

fontSize.addEventListener(
"input",
() => {

quote.style.fontSize =
fontSize.value + "px";

fontValue.textContent =
fontSize.value;

});


/* =====================================================
   COLORS
===================================================== */

textColor.addEventListener(
"input",
() => {

quote.style.color =
textColor.value;

author.style.color =
textColor.value;

});


backgroundColor.addEventListener(
"input",
() => {

canvas.style.background =
backgroundColor.value;

});


/* =====================================================
   FORMAT SELECTOR
===================================================== */

document
.querySelectorAll(".preset")
.forEach(button => {

button.addEventListener(
"click",
() => {

document
.querySelectorAll(".preset")
.forEach(x =>
x.classList.remove("active")
);

button.classList.add("active");

exportWidth =
Number(button.dataset.width);

exportHeight =
Number(button.dataset.height);

exportName =
button.dataset.name;

status.textContent =
exportWidth +
" × " +
exportHeight +
" selected";

updatePreview();

}
);

});


/* =====================================================
   PREVIEW RATIO
===================================================== */

function updatePreview(){

const ratio =
exportWidth /
exportHeight;

let width =
Math.min(
window.innerWidth * .88,
360
);

if(window.innerWidth > 800){

width = 360;

}

canvas.style.width =
width + "px";

canvas.style.height =
(width / ratio) + "px";

}


window.addEventListener(
"resize",
updatePreview
);


/* =====================================================
   BACKGROUNDS
===================================================== */

document
.querySelectorAll(".bg")
.forEach(button => {

button.addEventListener(
"click",
() => {

document
.querySelectorAll(".bg")
.forEach(x =>
x.classList.remove("active")
);

button.classList.add("active");

canvas.style.background =
button.dataset.bg;

}
);

});


/* =====================================================
   SAFE AREA
===================================================== */

safeToggle.addEventListener(
"change",
() => {

safeZone.style.display =
safeToggle.checked
? "block"
: "none";

});


/* =====================================================
   RANDOM QUOTES
===================================================== */

const quotes = [

[
"सफलता उन्हीं लोगों को मिलती है जो लगातार प्रयास करते रहते हैं।",
"अज्ञात"
],

[
"हर दिन खुद को कल से बेहतर बनाने की कोशिश करें।",
"अज्ञात"
],

[
"मुश्किल रास्ते अक्सर खूबसूरत मंजिल तक ले जाते हैं।",
"अज्ञात"
],

[
"आज का छोटा प्रयास कल की बड़ी सफलता बन सकता है।",
"अज्ञात"
],

[
"समय की कद्र करने वाला व्यक्ति जीवन में बहुत आगे जाता है।",
"अज्ञात"
],

[
"अपने सपनों पर विश्वास रखिए और मेहनत करते रहिए।",
"अज्ञात"
],

[
"शुरुआत छोटी हो सकती है, लेकिन सोच हमेशा बड़ी रखिए।",
"अज्ञात"
],

[
"हार मान लेना असफलता है, कोशिश करते रहना सफलता की शुरुआत है।",
"अज्ञात"
]

];


function randomQuote(){

const item =
quotes[
Math.floor(
Math.random() *
quotes.length
)
];

quoteInput.value =
item[0];

authorInput.value =
item[1];

quote.textContent =
item[0];

author.textContent =
"— " + item[1];

}


/* =====================================================
   CREATE IMAGE
===================================================== */

async function createImage(){

if(typeof html2canvas === "undefined"){

throw new Error(
"Image engine is still loading."
);

}

const oldWidth =
canvas.style.width;

const oldHeight =
canvas.style.height;

const oldRadius =
canvas.style.borderRadius;

const oldSafe =
safeZone.style.display;


/* Hide guide */

safeZone.style.display =
"none";


/* Exact selected size */

canvas.style.width =
exportWidth + "px";

canvas.style.height =
exportHeight + "px";

canvas.style.borderRadius =
"0";


/*
Important:
The image is rendered at the
currently selected social size.
*/

const image =
await html2canvas(
canvas,
{
width:exportWidth,
height:exportHeight,
scale:1,
useCORS:true,
backgroundColor:null,
logging:false
}
);


/* Restore preview */

canvas.style.width =
oldWidth;

canvas.style.height =
oldHeight;

canvas.style.borderRadius =
oldRadius;

safeZone.style.display =
oldSafe;


/* Return canvas */

return image;

}


/* =====================================================
   DOWNLOAD SELECTED FORMAT
===================================================== */

async function downloadImage(){

try{

status.textContent =
"Creating image...";

const image =
await createImage();

const filename =
"quote-" +
exportName +
"-" +
exportWidth +
"x" +
exportHeight +
".png";

const link =
document.createElement("a");

link.download =
filename;

link.href =
image.toDataURL(
"image/png"
);

document.body.appendChild(link);

link.click();

link.remove();

status.textContent =
"Downloaded " +
exportWidth +
" × " +
exportHeight;

}catch(error){

console.error(error);

status.textContent =
"Could not create image.";

alert(
"Unable to create image. Please try again."
);

}

}


/* =====================================================
   SHARE SELECTED FORMAT
===================================================== */

async function shareImage(){

try{

status.textContent =
"Preparing selected format...";


/*
The currently selected exportWidth
and exportHeight are used here.
*/

const image =
await createImage();


const blob =
await new Promise(
resolve => {

image.toBlob(
resolve,
"image/png",
1.0
);

}
);


if(!blob){

throw new Error(
"Image creation failed."
);

}


const filename =
"quote-" +
exportName +
"-" +
exportWidth +
"x" +
exportHeight +
".png";


const file =
new File(
[blob],
filename,
{
type:"image/png"
}
);


/*
Android Chrome supports
Web Share with files.
*/

if(
navigator.share &&
navigator.canShare &&
navigator.canShare({
files:[file]
})
){

await navigator.share({

files:[file],

title:"Quote",

text:
exportWidth +
" × " +
exportHeight +
" Quote"

});

status.textContent =
"Image shared successfully.";

}else{

/*
Fallback:
download exactly the selected format.
*/

const url =
URL.createObjectURL(blob);

const link =
document.createElement("a");

link.href =
url;

link.download =
filename;

document.body.appendChild(link);

link.click();

link.remove();

setTimeout(
() => URL.revokeObjectURL(url),
1000
);

status.textContent =
"Selected format downloaded.";

alert(
"Your browser does not support direct image sharing. The selected image has been downloaded."
);

}

}catch(error){

console.error(
"Share error:",
error
);

status.textContent =
"Sharing cancelled or failed.";

}

}


/* =====================================================
   PWA INSTALL
===================================================== */

let deferredPrompt = null;

const installButton =
document.getElementById(
"installButton"
);


window.addEventListener(
"beforeinstallprompt",
event => {

event.preventDefault();

deferredPrompt =
event;

installButton.style.display =
"block";

}
);


installButton.addEventListener(
"click",
async () => {

if(!deferredPrompt)
return;

deferredPrompt.prompt();

await deferredPrompt.userChoice;

deferredPrompt = null;

installButton.style.display =
"none";

}
);


/* =====================================================
   SERVICE WORKER
===================================================== */

if(
"serviceWorker"
in navigator
){

window.addEventListener(
"load",
() => {

navigator
.serviceWorker
.register("./sw.js")
.then(
() =>
console.log(
"Quote Maker PWA ready"
)
)
.catch(
error =>
console.log(
"Service worker error:",
error
)
);

}
);

}


/* =====================================================
   HTML2CANVAS
===================================================== */

const script =
document.createElement("script");

script.src =
"https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";

script.onload =
() => {

status.textContent =
"1080 × 1920 selected";

};

document.head.appendChild(
script
);


/* INITIAL */

updatePreview();

</script>

</body>
</html>
