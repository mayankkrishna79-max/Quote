<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#0f172a">

<link rel="manifest" href="manifest.json">

<title>Social Quote Maker</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap');

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    background:#020617;
    color:#fff;
    font-family:Inter,Arial,sans-serif;
}

body{
    min-height:100vh;
}

.app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

/* ================= HEADER ================= */

.header{
    height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    background:#111827;
    border-bottom:1px solid #273449;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:18px;
    font-weight:800;
}

.install{
    display:none;
    width:auto;
    margin:0;
    padding:8px 12px;
    background:#2563eb;
    color:#fff;
    border-radius:9px;
}

/* ================= MAIN ================= */

.main{
    display:flex;
    min-height:calc(100vh - 60px);
}

/* ================= CONTROLS ================= */

.controls{
    width:350px;
    padding:16px;
    background:#111827;
    overflow-y:auto;
}

.section{
    margin-bottom:18px;
}

.section-title{
    color:#94a3b8;
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:8px;
}

textarea,
input,
select{
    width:100%;
    background:#1e293b;
    border:1px solid #334155;
    color:#fff;
    border-radius:10px;
    padding:11px;
    font-family:inherit;
    outline:none;
}

textarea{
    height:105px;
    resize:none;
}

textarea:focus,
input:focus,
select:focus{
    border-color:#3b82f6;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

label{
    display:block;
    color:#cbd5e1;
    font-size:12px;
    margin-bottom:5px;
}

button{
    width:100%;
    border:0;
    border-radius:10px;
    padding:12px;
    color:white;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.primary{
    background:#2563eb;
}

.success{
    background:#16a34a;
}

.secondary{
    background:#334155;
}

.purple{
    background:#7c3aed;
}

/* ================= SIZE PRESETS ================= */

.presets{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.preset{
    background:#1e293b;
    border:1px solid #334155;
    padding:10px 5px;
}

.preset small{
    display:block;
    color:#94a3b8;
    font-size:10px;
    margin-top:3px;
}

.preset.active{
    background:#1d4ed8;
    border-color:#60a5fa;
}

/* ================= BACKGROUNDS ================= */

.backgrounds{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
}

.bg{
    height:43px;
    padding:0;
    border:2px solid transparent;
}

.bg.active{
    border-color:#fff;
}

/* ================= COLOR ================= */

input[type="color"]{
    height:42px;
    padding:3px;
}

input[type="range"]{
    width:100%;
    accent-color:#3b82f6;
}

.range-value{
    float:right;
    color:#60a5fa;
}

/* ================= PREVIEW AREA ================= */

.preview{
    flex:1;
    min-width:0;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
    background:#020617;
    overflow:auto;
}

/* ================= SOCIAL CANVAS ================= */

.canvas{
    position:relative;
    width:360px;
    height:640px;
    flex-shrink:0;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:6px;
    background:
        linear-gradient(
            135deg,
            #111827,
            #1d4ed8
        );
    box-shadow:
        0 25px 80px rgba(0,0,0,.6);
}

/* Decorative circles */

.canvas:before{
    content:"";
    position:absolute;
    width:480px;
    height:480px;
    border-radius:50%;
    background:rgba(255,255,255,.07);
    top:-230px;
    right:-170px;
}

.canvas:after{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    border-radius:50%;
    background:rgba(255,255,255,.05);
    bottom:-190px;
    left:-140px;
}

/* ================= SAFE ZONE ================= */

.safe-zone{
    position:absolute;
    left:8%;
    right:8%;
    top:16%;
    bottom:18%;
    z-index:3;
    pointer-events:none;
    border:1px dashed rgba(255,255,255,.15);
    border-radius:10px;
}

/* ================= QUOTE ================= */

.content{
    width:78%;
    text-align:center;
    position:relative;
    z-index:5;
}

.quote-mark{
    font-family:Georgia,serif;
    font-size:55px;
    line-height:.5;
    opacity:.4;
    margin-bottom:20px;
}

.quote{
    font-family:
        "Noto Sans Devanagari",
        Arial,
        sans-serif;
    font-size:26px;
    font-weight:700;
    line-height:1.45;
    overflow-wrap:break-word;
}

.author{
    margin-top:24px;
    font-size:15px;
    opacity:.9;
}

.brand{
    position:absolute;
    z-index:6;
    bottom:35px;
    left:0;
    right:0;
    text-align:center;
    font-size:10px;
    letter-spacing:1.5px;
    opacity:.75;
}

/* ================= SAFE ZONE SWITCH ================= */

.safe-control{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#1e293b;
    border-radius:10px;
    padding:10px 12px;
}

.safe-control span{
    font-size:12px;
}

.switch{
    width:42px;
    height:23px;
    appearance:none;
    background:#475569;
    border-radius:20px;
    position:relative;
    cursor:pointer;
}

.switch:before{
    content:"";
    position:absolute;
    width:17px;
    height:17px;
    border-radius:50%;
    background:#fff;
    top:3px;
    left:3px;
    transition:.2s;
}

.switch:checked{
    background:#2563eb;
}

.switch:checked:before{
    left:22px;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

    .main{
        flex-direction:column;
    }

    .preview{
        order:1;
        min-height:calc(100vh - 60px);
        padding:12px 5px;
    }

    .controls{
        order:2;
        width:100%;
    }

    .canvas{
        width:88vw;
        height:calc(88vw * 1.777777);
        max-width:360px;
        max-height:640px;
    }

}

</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">
        ✨ Social Quote Maker
    </div>

    <button
        id="installButton"
        class="install">
        Install App
    </button>

</header>


<main class="main">

<!-- ================= CONTROLS ================= -->

<section class="controls">

    <!-- QUOTE -->

    <div class="section">

        <div class="section-title">
            Quote
        </div>

        <textarea
            id="quoteInput">सफलता उन्हीं लोगों को मिलती है जो लगातार प्रयास करते रहते हैं।</textarea>

    </div>


    <!-- AUTHOR -->

    <div class="section">

        <div class="section-title">
            Author
        </div>

        <input
            id="authorInput"
            value="अज्ञात">

    </div>


    <!-- BRAND -->

    <div class="section">

        <div class="section-title">
            Brand
        </div>

        <input
            id="brandInput"
            value="QUOTE MAKER">

    </div>


    <!-- FORMAT -->

    <div class="section">

        <div class="section-title">
            Social Media Format
        </div>

        <div class="presets">

            <button
                class="preset active"
                data-width="1080"
                data-height="1920">

                Instagram / WhatsApp / Shorts

                <small>
                    1080 × 1920 • 9:16
                </small>

            </button>


            <button
                class="preset"
                data-width="1080"
                data-height="1350">

                Instagram Portrait

                <small>
                    1080 × 1350 • 4:5
                </small>

            </button>


            <button
                class="preset"
                data-width="1080"
                data-height="1080">

                Instagram Square

                <small>
                    1080 × 1080 • 1:1
                </small>

            </button>


            <button
                class="preset"
                data-width="1080"
                data-height="1440">

                Custom Portrait

                <small>
                    1080 × 1440
                </small>

            </button>

        </div>

    </div>


    <!-- FONT -->

    <div class="section">

        <div class="section-title">
            Font Size
        </div>

        <label>

            Size

            <span
                id="fontValue"
                class="range-value">
                26
            </span>

        </label>

        <input
            id="fontSize"
            type="range"
            min="16"
            max="55"
            value="26">

    </div>


    <!-- COLORS -->

    <div class="section">

        <div class="section-title">
            Colors
        </div>

        <div class="row">

            <div>

                <label>
                    Text
                </label>

                <input
                    id="textColor"
                    type="color"
                    value="#ffffff">

            </div>


            <div>

                <label>
                    Background
                </label>

                <input
                    id="backgroundColor"
                    type="color"
                    value="#111827">

            </div>

        </div>

    </div>


    <!-- BACKGROUNDS -->

    <div class="section">

        <div class="section-title">
            Background Style
        </div>

        <div class="backgrounds">

            <button
                class="bg active"
                data-bg="linear-gradient(135deg,#111827,#1d4ed8)"
                style="background:linear-gradient(135deg,#111827,#1d4ed8)">
            </button>

            <button
                class="bg"
                data-bg="linear-gradient(135deg,#7c2d12,#db2777)"
                style="background:linear-gradient(135deg,#7c2d12,#db2777)">
            </button>

            <button
                class="bg"
                data-bg="linear-gradient(135deg,#064e3b,#15803d)"
                style="background:linear-gradient(135deg,#064e3b,#15803d)">
            </button>

            <button
                class="bg"
                data-bg="linear-gradient(135deg,#312e81,#9333ea)"
                style="background:linear-gradient(135deg,#312e81,#9333ea)">
            </button>

            <button
                class="bg"
                data-bg="#020617"
                style="background:#020617">
            </button>

            <button
                class="bg"
                data-bg="#fef3c7"
                style="background:#fef3c7">
            </button>

            <button
                class="bg"
                data-bg="linear-gradient(135deg,#450a0a,#dc2626)"
                style="background:linear-gradient(135deg,#450a0a,#dc2626)">
            </button>

            <button
                class="bg"
                data-bg="linear-gradient(135deg,#082f49,#0891b2)"
                style="background:linear-gradient(135deg,#082f49,#0891b2)">
            </button>

        </div>

    </div>


    <!-- SAFE AREA -->

    <div class="section">

        <div class="safe-control">

            <span>
                Show Social Safe Area
            </span>

            <input
                id="safeToggle"
                class="switch"
                type="checkbox"
                checked>

        </div>

    </div>


    <!-- ACTIONS -->

    <div class="section">

        <button
            class="secondary"
            onclick="randomQuote()">
            🎲 Random Quote
        </button>

        <br><br>

        <button
            class="success"
            onclick="downloadImage()">
            ⬇️ Download Image
        </button>

        <br><br>

        <button
            class="primary"
            onclick="shareImage()">
            📤 Share Image
        </button>

    </div>

</section>


<!-- ================= PREVIEW ================= -->

<section class="preview">

    <div
        id="canvas"
        class="canvas">

        <div
            id="safeZone"
            class="safe-zone">
        </div>


        <div class="content">

            <div class="quote-mark">
                “
            </div>

            <div
                id="quote"
                class="quote">
                सफलता उन्हीं लोगों को मिलती है जो लगातार प्रयास करते रहते हैं।
            </div>

            <div
                id="author"
                class="author">
                — अज्ञात
            </div>

        </div>


        <div
            id="brand"
            class="brand">
            QUOTE MAKER
        </div>

    </div>

</section>

</main>

</div>


<script>

/* =====================================================
   VARIABLES
===================================================== */

const canvas =
document.getElementById("canvas");

const quoteInput =
document.getElementById("quoteInput");

const authorInput =
document.getElementById("authorInput");

const brandInput =
document.getElementById("brandInput");

const quote =
document.getElementById("quote");

const author =
document.getElementById("author");

const brand =
document.getElementById("brand");

const fontSize =
document.getElementById("fontSize");

const fontValue =
document.getElementById("fontValue");

const textColor =
document.getElementById("textColor");

const backgroundColor =
document.getElementById("backgroundColor");

const safeZone =
document.getElementById("safeZone");

const safeToggle =
document.getElementById("safeToggle");


/* =====================================================
   TEXT UPDATE
===================================================== */

quoteInput.addEventListener(
    "input",
    () => {

        quote.textContent =
            quoteInput.value;

    }
);


authorInput.addEventListener(
    "input",
    () => {

        author.textContent =
            authorInput.value
            ? "— " + authorInput.value
            : "";

    }
);


brandInput.addEventListener(
    "input",
    () => {

        brand.textContent =
            brandInput.value;

    }
);


/* =====================================================
   FONT
===================================================== */

fontSize.addEventListener(
    "input",
    () => {

        quote.style.fontSize =
            fontSize.value + "px";

        fontValue.textContent =
            fontSize.value;

    }
);


/* =====================================================
   COLORS
===================================================== */

textColor.addEventListener(
    "input",
    () => {

        quote.style.color =
            textColor.value;

        author.style.color =
            textColor.value;

    }
);


backgroundColor.addEventListener(
    "input",
    () => {

        canvas.style.background =
            backgroundColor.value;

    }
);


/* =====================================================
   SOCIAL FORMAT
===================================================== */

let exportWidth = 1080;
let exportHeight = 1920;


document
.querySelectorAll(".preset")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            document
            .querySelectorAll(".preset")
            .forEach(x =>
                x.classList.remove("active")
            );

            button.classList.add("active");

            exportWidth =
                Number(button.dataset.width);

            exportHeight =
                Number(button.dataset.height);

            updatePreviewRatio();

        }
    );

});


function updatePreviewRatio(){

    const ratio =
        exportWidth /
        exportHeight;

    const previewWidth =
        Math.min(
            window.innerWidth * .88,
            360
        );

    canvas.style.width =
        previewWidth + "px";

    canvas.style.height =
        (previewWidth / ratio) + "px";

}


/* =====================================================
   BACKGROUNDS
===================================================== */

document
.querySelectorAll(".bg")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            document
            .querySelectorAll(".bg")
            .forEach(x =>
                x.classList.remove("active")
            );

            button.classList.add("active");

            canvas.style.background =
                button.dataset.bg;

        }
    );

});


/* =====================================================
   SAFE AREA
===================================================== */

safeToggle.addEventListener(
    "change",
    () => {

        safeZone.style.display =
            safeToggle.checked
            ? "block"
            : "none";

    }
);


/* =====================================================
   RANDOM QUOTES
===================================================== */

const quotes = [

[
"सफलता उन्हीं लोगों को मिलती है जो लगातार प्रयास करते रहते हैं।",
"अज्ञात"
],

[
"हर दिन खुद को कल से बेहतर बनाने की कोशिश करें।",
"अज्ञात"
],

[
"मुश्किल रास्ते अक्सर खूबसूरत मंजिल तक ले जाते हैं।",
"अज्ञात"
],

[
"आज का छोटा प्रयास कल की बड़ी सफलता बन सकता है।",
"अज्ञात"
],

[
"समय की कद्र करने वाला व्यक्ति जीवन में बहुत आगे जाता है।",
"अज्ञात"
],

[
"अपने सपनों पर विश्वास रखिए और मेहनत करते रहिए।",
"अज्ञात"
],

[
"शुरुआत छोटी हो सकती है, लेकिन सोच हमेशा बड़ी रखिए।",
"अज्ञात"
],

[
"हार मान लेना असफलता है, कोशिश करते रहना सफलता की शुरुआत है।",
"अज्ञात"
]

];


function randomQuote(){

    const item =
        quotes[
            Math.floor(
                Math.random() *
                quotes.length
            )
        ];

    quoteInput.value =
        item[0];

    authorInput.value =
        item[1];

    quote.textContent =
        item[0];

    author.textContent =
        "— " + item[1];

}


/* =====================================================
   DOWNLOAD
===================================================== */

async function downloadImage(){

    if(typeof html2canvas === "undefined"){

        alert(
            "Image engine is loading. Please try again."
        );

        return;

    }

    const oldWidth =
        canvas.style.width;

    const oldHeight =
        canvas.style.height;

    const oldRadius =
        canvas.style.borderRadius;

    const oldSafe =
        safeZone.style.display;

    /* Export without safe-area guide */

    safeZone.style.display =
        "none";

    canvas.style.width =
        exportWidth + "px";

    canvas.style.height =
        exportHeight + "px";

    canvas.style.borderRadius =
        "0";

    const image =
        await html2canvas(
            canvas,
            {
                width:exportWidth,
                height:exportHeight,
                scale:1,
                useCORS:true,
                backgroundColor:null
            }
        );

    const link =
        document.createElement("a");

    link.download =
        "quote-" +
        exportWidth +
        "x" +
        exportHeight +
        ".png";

    link.href =
        image.toDataURL(
            "image/png"
        );

    link.click();

    canvas.style.width =
        oldWidth;

    canvas.style.height =
        oldHeight;

    canvas.style.borderRadius =
        oldRadius;

    safeZone.style.display =
        oldSafe;

}


/* =====================================================
   SHARE IMAGE
===================================================== */

async function shareImage(){

    if(typeof html2canvas === "undefined"){

        alert(
            "Image engine is loading."
        );

        return;

    }

    const oldWidth =
        canvas.style.width;

    const oldHeight =
        canvas.style.height;

    const oldRadius =
        canvas.style.borderRadius;

    const oldSafe =
        safeZone.style.display;

    safeZone.style.display =
        "none";

    canvas.style.width =
        exportWidth + "px";

    canvas.style.height =
        exportHeight + "px";

    canvas.style.borderRadius =
        "0";

    const image =
        await html2canvas(
            canvas,
            {
                width:exportWidth,
                height:exportHeight,
                scale:1,
                useCORS:true
            }
        );

    image.toBlob(
        async blob => {

            const file =
                new File(
                    [blob],
                    "quote.png",
                    {
                        type:"image/png"
                    }
                );

            if(
                navigator.share &&
                navigator.canShare &&
                navigator.canShare({
                    files:[file]
                })
            ){

                try{

                    await navigator.share({
                        files:[file],
                        title:"Quote"
                    });

                }catch(e){}

            }else{

                const link =
                    document.createElement("a");

                link.download =
                    "quote.png";

                link.href =
                    URL.createObjectURL(blob);

                link.click();

                alert(
                    "Image downloaded. You can now upload it to Instagram, WhatsApp or YouTube Shorts."
                );

            }

        },
        "image/png"
    );

    canvas.style.width =
        oldWidth;

    canvas.style.height =
        oldHeight;

    canvas.style.borderRadius =
        oldRadius;

    safeZone.style.display =
        oldSafe;

}


/* =====================================================
   PWA INSTALL
===================================================== */

let deferredPrompt = null;

const installButton =
    document.getElementById(
        "installButton"
    );


window.addEventListener(
    "beforeinstallprompt",
    event => {

        event.preventDefault();

        deferredPrompt =
            event;

        installButton.style.display =
            "block";

    }
);


installButton.addEventListener(
    "click",
    async () => {

        if(!deferredPrompt)
            return;

        deferredPrompt.prompt();

        await deferredPrompt.userChoice;

        deferredPrompt = null;

        installButton.style.display =
            "none";

    }
);


/* =====================================================
   SERVICE WORKER
===================================================== */

if(
    "serviceWorker"
    in navigator
){

    window.addEventListener(
        "load",
        () => {

            navigator
            .serviceWorker
            .register(
                "./sw.js"
            );

        }
    );

}


/* =====================================================
   HTML2CANVAS
===================================================== */

const script =
document.createElement("script");

script.src =
"https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";

document.head.appendChild(script);


/* INITIAL */

updatePreviewRatio();

</script>

</body>
</html>
