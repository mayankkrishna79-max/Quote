<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="description"
      content="Create beautiful motivational quotes for Instagram, YouTube Shorts and WhatsApp Status.">

<link rel="manifest" href="manifest.json">

<title>Quote Maker</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap');

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#0f172a;
    color:white;
    font-family:Inter,Arial,sans-serif;
}

body{
    overflow-x:hidden;
}

.app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:62px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    background:#111827;
    border-bottom:1px solid #263244;
    position:sticky;
    top:0;
    z-index:50;
}

.logo{
    font-size:19px;
    font-weight:800;
}

.install-btn{
    width:auto;
    margin:0;
    padding:8px 12px;
    background:#2563eb;
    color:#fff;
    border-radius:9px;
}

/* MAIN */

.main{
    display:flex;
    flex:1;
}

/* CONTROLS */

.controls{
    width:350px;
    background:#111827;
    padding:18px;
    overflow-y:auto;
}

.section{
    margin-bottom:18px;
}

.title{
    color:#94a3b8;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:8px;
}

textarea,
input,
select{
    width:100%;
    border:1px solid #334155;
    background:#1e293b;
    color:#fff;
    border-radius:10px;
    padding:12px;
    outline:none;
    font-family:inherit;
}

textarea{
    min-height:110px;
    resize:none;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#60a5fa;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

label{
    display:block;
    font-size:12px;
    color:#cbd5e1;
    margin-bottom:5px;
}

button{
    border:0;
    border-radius:10px;
    padding:12px;
    width:100%;
    color:white;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
}

.primary{
    background:#2563eb;
}

.success{
    background:#16a34a;
}

.secondary{
    background:#334155;
}

.install{
    background:#7c3aed;
}

button:active{
    transform:scale(.98);
}

.range{
    width:100%;
    accent-color:#3b82f6;
}

.range-value{
    float:right;
    color:#60a5fa;
}

.colors{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

input[type=color]{
    height:44px;
    padding:3px;
}

/* BACKGROUND BUTTONS */

.backgrounds{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
}

.bg{
    height:45px;
    padding:0;
    border:2px solid transparent;
}

.bg.active{
    border-color:white;
}

/* PREVIEW */

.preview{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
    overflow:auto;
    background:#020617;
}

.canvas{
    width:360px;
    height:640px;
    position:relative;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:6px;
    box-shadow:0 20px 80px rgba(0,0,0,.5);
}

.canvas:before{
    content:"";
    position:absolute;
    width:450px;
    height:450px;
    border-radius:50%;
    background:rgba(255,255,255,.07);
    top:-200px;
    right:-150px;
}

.canvas:after{
    content:"";
    position:absolute;
    width:320px;
    height:320px;
    border-radius:50%;
    background:rgba(255,255,255,.05);
    bottom:-170px;
    left:-130px;
}

.content{
    width:84%;
    text-align:center;
    position:relative;
    z-index:2;
}

.quote-mark{
    font-family:Georgia,serif;
    font-size:58px;
    line-height:.5;
    opacity:.45;
    margin-bottom:22px;
}

.quote{
    font-family:"Noto Sans Devanagari",sans-serif;
    font-size:26px;
    line-height:1.45;
    font-weight:700;
    overflow-wrap:break-word;
}

.author{
    margin-top:25px;
    font-size:15px;
    opacity:.9;
}

.brand{
    position:absolute;
    bottom:17px;
    left:0;
    right:0;
    text-align:center;
    font-size:10px;
    letter-spacing:1.2px;
    opacity:.75;
    z-index:5;
}

/* MOBILE */

@media(max-width:800px){

    .main{
        flex-direction:column;
    }

    .controls{
        width:100%;
        order:2;
        padding:15px;
    }

    .preview{
        order:1;
        min-height:calc(100vh - 62px);
        padding:18px 10px;
    }

    .canvas{
        width:min(82vw,360px);
        height:calc(min(82vw,360px) * 1.777777);
    }

    .quote{
        font-size:24px;
    }

}

@media(max-width:430px){

    .preview{
        padding:12px 5px;
    }

    .canvas{
        width:88vw;
        height:calc(88vw * 1.777777);
    }

}

</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">✨ Quote Maker</div>

    <button
        id="installButton"
        class="install-btn"
        style="display:none">
        Install
    </button>

</header>


<main class="main">

<!-- CONTROLS -->

<section class="controls">

    <div class="section">

        <div class="title">Your Quote</div>

        <textarea id="quoteInput">सफलता उन्हीं लोगों को मिलती है जो लगातार प्रयास करते रहते हैं।</textarea>

    </div>


    <div class="section">

        <div class="title">Author</div>

        <input
            id="authorInput"
            value="अज्ञात"
            placeholder="Author">

    </div>


    <div class="section">

        <div class="title">Brand</div>

        <input
            id="brandInput"
            value="QUOTE MAKER"
            placeholder="Your brand">

    </div>


    <div class="section">

        <div class="title">Font Size</div>

        <label>
            Size
            <span class="range-value" id="sizeValue">26</span>
        </label>

        <input
            class="range"
            id="fontSize"
            type="range"
            min="16"
            max="55"
            value="26">

    </div>


    <div class="section">

        <div class="title">Colors</div>

        <div class="colors">

            <div>
                <label>Text</label>
                <input
                    id="textColor"
                    type="color"
                    value="#ffffff">
            </div>

            <div>
                <label>Background</label>
                <input
                    id="backgroundColor"
                    type="color"
                    value="#111827">
            </div>

        </div>

    </div>


    <div class="section">

        <div class="title">Background</div>

        <div class="backgrounds">

            <button class="bg active"
                data-bg="linear-gradient(135deg,#111827,#1d4ed8)"
                style="background:linear-gradient(135deg,#111827,#1d4ed8)">
            </button>

            <button class="bg"
                data-bg="linear-gradient(135deg,#7c2d12,#db2777)"
                style="background:linear-gradient(135deg,#7c2d12,#db2777)">
            </button>

            <button class="bg"
                data-bg="linear-gradient(135deg,#064e3b,#15803d)"
                style="background:linear-gradient(135deg,#064e3b,#15803d)">
            </button>

            <button class="bg"
                data-bg="linear-gradient(135deg,#312e81,#9333ea)"
                style="background:linear-gradient(135deg,#312e81,#9333ea)">
            </button>

            <button class="bg"
                data-bg="#020617"
                style="background:#020617">
            </button>

            <button class="bg"
                data-bg="#fef3c7"
                style="background:#fef3c7">
            </button>

            <button class="bg"
                data-bg="linear-gradient(135deg,#450a0a,#dc2626)"
                style="background:linear-gradient(135deg,#450a0a,#dc2626)">
            </button>

            <button class="bg"
                data-bg="linear-gradient(135deg,#082f49,#0891b2)"
                style="background:linear-gradient(135deg,#082f49,#0891b2)">
            </button>

        </div>

    </div>


    <div class="section">

        <button
            class="secondary"
            onclick="randomQuote()">
            🎲 Random Quote
        </button>

        <br><br>

        <button
            class="success"
            onclick="downloadQuote()">
            ⬇️ Download 1080×1920
        </button>

        <br><br>

        <button
            class="primary"
            onclick="shareQuote()">
            📤 Share Quote
        </button>

    </div>

</section>


<!-- PREVIEW -->

<section class="preview">

    <div id="canvas" class="canvas"
        style="background:linear-gradient(135deg,#111827,#1d4ed8)">

        <div class="content">

            <div class="quote-mark">“</div>

            <div
                id="quote"
                class="quote">
                सफलता उन्हीं लोगों को मिलती हैं जो लगातार प्रयास करते रहते हैं।
            </div>

            <div
                id="author"
                class="author">
                — अज्ञात
            </div>

        </div>

        <div
            id="brand"
            class="brand">
            QUOTE MAKER
        </div>

    </div>

</section>

</main>

</div>


<script>

/* ELEMENTS */

const quoteInput =
document.getElementById("quoteInput");

const authorInput =
document.getElementById("authorInput");

const brandInput =
document.getElementById("brandInput");

const quote =
document.getElementById("quote");

const author =
document.getElementById("author");

const brand =
document.getElementById("brand");

const canvas =
document.getElementById("canvas");

const fontSize =
document.getElementById("fontSize");

const sizeValue =
document.getElementById("sizeValue");

const textColor =
document.getElementById("textColor");

const backgroundColor =
document.getElementById("backgroundColor");


/* LIVE TEXT */

quoteInput.addEventListener("input",()=>{
    quote.textContent=quoteInput.value;
});

authorInput.addEventListener("input",()=>{
    author.textContent=
        authorInput.value
        ? "— "+authorInput.value
        : "";
});

brandInput.addEventListener("input",()=>{
    brand.textContent=brandInput.value;
});

fontSize.addEventListener("input",()=>{
    quote.style.fontSize=fontSize.value+"px";
    sizeValue.textContent=fontSize.value;
});

textColor.addEventListener("input",()=>{
    quote.style.color=textColor.value;
    author.style.color=textColor.value;
});

backgroundColor.addEventListener("input",()=>{
    canvas.style.background=backgroundColor.value;
});


/* BACKGROUNDS */

document.querySelectorAll(".bg").forEach(btn=>{

    btn.addEventListener("click",()=>{

        document
        .querySelectorAll(".bg")
        .forEach(x=>x.classList.remove("active"));

        btn.classList.add("active");

        canvas.style.background=
            btn.dataset.bg;

    });

});


/* RANDOM QUOTES */

const quotes=[

["सफलता उन्हीं लोगों को मिलती है जो लगातार प्रयास करते रहते हैं।","अज्ञात"],

["हर दिन खुद को कल से बेहतर बनाने की कोशिश करें।","अज्ञात"],

["मुश्किल रास्ते अक्सर खूबसूरत मंजिल तक ले जाते हैं।","अज्ञात"],

["आज का छोटा प्रयास कल की बड़ी सफलता बन सकता है।","अज्ञात"],

["समय की कद्र करने वाला व्यक्ति जीवन में बहुत आगे जाता है।","अज्ञात"],

["अपने सपनों पर विश्वास रखिए और मेहनत करते रहिए।","अज्ञात"],

["शुरुआत छोटी हो सकती है, लेकिन सोच हमेशा बड़ी रखिए।","अज्ञात"]

];


function randomQuote(){

    const item=
        quotes[
            Math.floor(Math.random()*quotes.length)
        ];

    quoteInput.value=item[0];
    authorInput.value=item[1];

    quote.textContent=item[0];
    author.textContent="— "+item[1];

}


/* DOWNLOAD */

async function downloadQuote(){

    if(typeof html2canvas==="undefined"){
        alert("Please wait for the app to load.");
        return;
    }

    const oldWidth=canvas.style.width;
    const oldHeight=canvas.style.height;
    const oldRadius=canvas.style.borderRadius;

    canvas.style.width="1080px";
    canvas.style.height="1920px";
    canvas.style.borderRadius="0";

    const image=
        await html2canvas(canvas,{
            width:1080,
            height:1920,
            scale:1,
            useCORS:true,
            backgroundColor:null
        });

    const link=
        document.createElement("a");

    link.download=
        "quote-1080x1920.png";

    link.href=
        image.toDataURL("image/png");

    link.click();

    canvas.style.width=oldWidth;
    canvas.style.height=oldHeight;
    canvas.style.borderRadius=oldRadius;

}


/* SHARE */

async function shareQuote(){

    const text=
        quoteInput.value+
        "\n\n— "+
        authorInput.value;

    if(navigator.share){

        try{

            await navigator.share({
                title:"Quote",
                text:text
            });

        }catch(e){}

    }else{

        await navigator.clipboard.writeText(text);

        alert("Quote copied.");

    }

}


/* PWA INSTALL */

let deferredPrompt;

const installButton=
    document.getElementById("installButton");

window.addEventListener(
    "beforeinstallprompt",
    event=>{

        event.preventDefault();

        deferredPrompt=event;

        installButton.style.display="block";

    }
);


installButton.addEventListener(
    "click",
    async()=>{

        if(!deferredPrompt)
            return;

        deferredPrompt.prompt();

        await deferredPrompt.userChoice;

        deferredPrompt=null;

        installButton.style.display="none";

    }
);


/* SERVICE WORKER */

if("serviceWorker" in navigator){

    window.addEventListener("load",()=>{

        navigator.serviceWorker
        .register("./sw.js")
        .then(()=>{
            console.log("PWA ready");
        })
        .catch(error=>{
            console.log(
                "Service Worker error:",
                error
            );
        });

    });

}


/* LOAD HTML2CANVAS */

const script=
document.createElement("script");

script.src=
"https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";

document.head.appendChild(script);

</script>

</body>
</html>
