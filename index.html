<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>Quote Maker</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0f172a;
    color: #fff;
    font-family: Inter, sans-serif;
}

.app {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 360px 1fr;
}

/* =========================
   CONTROL PANEL
========================= */

.sidebar {
    background: #111827;
    padding: 22px;
    overflow-y: auto;
    border-right: 1px solid #263244;
}

.logo {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 4px;
}

.subtitle {
    color: #94a3b8;
    font-size: 13px;
    margin-bottom: 22px;
}

.section {
    margin-bottom: 20px;
}

.section-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #94a3b8;
    margin-bottom: 10px;
}

textarea,
input,
select {
    width: 100%;
    border: 1px solid #334155;
    background: #1e293b;
    color: white;
    border-radius: 10px;
    padding: 11px;
    font-family: inherit;
    outline: none;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #60a5fa;
}

.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

label {
    display: block;
    font-size: 12px;
    color: #cbd5e1;
    margin-bottom: 6px;
}

.range-value {
    float: right;
    color: #60a5fa;
}

input[type="range"] {
    padding: 0;
    accent-color: #3b82f6;
}

input[type="color"] {
    height: 42px;
    padding: 4px;
    cursor: pointer;
}

button {
    width: 100%;
    border: 0;
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 8px;
    transition: .2s;
}

button:hover {
    transform: translateY(-1px);
}

.primary {
    background: #2563eb;
    color: white;
}

.success {
    background: #16a34a;
    color: white;
}

.secondary {
    background: #334155;
    color: white;
}

.danger {
    background: #7f1d1d;
    color: white;
}

.style-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
}

.style-btn {
    height: 45px;
    padding: 0;
    border: 2px solid transparent;
}

.style-btn.active {
    border-color: white;
}

/* =========================
   PREVIEW
========================= */

.preview-area {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 25px;
    overflow: auto;
}

.preview-wrapper {
    position: relative;
}

.canvas {
    width: 360px;
    height: 640px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg,#111827,#1e3a8a);
    box-shadow: 0 25px 80px rgba(0,0,0,.55);
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.canvas::before {
    content: "";
    position: absolute;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    background: rgba(255,255,255,.07);
    top: -180px;
    right: -160px;
}

.canvas::after {
    content: "";
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: rgba(255,255,255,.05);
    bottom: -150px;
    left: -100px;
}

.quote-container {
    position: relative;
    z-index: 2;
    width: 84%;
    text-align: center;
}

.quote-mark {
    font-family: Georgia, serif;
    font-size: 60px;
    line-height: .5;
    opacity: .5;
    margin-bottom: 22px;
}

.quote {
    font-family: "Noto Sans Devanagari", Inter, sans-serif;
    font-size: 26px;
    line-height: 1.45;
    font-weight: 700;
    word-break: break-word;
}

.author {
    font-family: "Noto Sans Devanagari", Inter, sans-serif;
    font-size: 15px;
    margin-top: 25px;
    opacity: .9;
}

.brand {
    position: absolute;
    z-index: 5;
    bottom: 18px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 1px;
    opacity: .75;
}

/* =========================
   MOBILE
========================= */

@media(max-width: 850px) {

    .app {
        display: block;
    }

    .sidebar {
        border-right: 0;
        border-bottom: 1px solid #263244;
    }

    .preview-area {
        min-height: auto;
        padding: 30px 15px;
    }
}

@media(max-width: 450px) {

    .canvas {
        width: min(90vw, 360px);
        height: calc(min(90vw, 360px) * 1.7778);
    }
}
</style>
</head>

<body>

<div class="app">

<!-- =========================
     SIDEBAR
========================= -->

<div class="sidebar">

    <div class="logo">✨ Quote Maker</div>
    <div class="subtitle">
        Instagram • YouTube Shorts • WhatsApp Status
    </div>

    <!-- QUOTE -->
    <div class="section">

        <div class="section-title">Quote</div>

        <textarea id="quoteInput"
        placeholder="Write your quote here...">सफलता उन्हीं लोगों को मिलती है जो लगातार प्रयास करते रहते हैं।</textarea>

    </div>

    <!-- AUTHOR -->
    <div class="section">

        <label>Author / Source</label>

        <input
        id="authorInput"
        value="Your Name"
        placeholder="Author name">

    </div>

    <!-- BRAND -->
    <div class="section">

        <label>Brand / Page Name</label>

        <input
        id="brandInput"
        value="QUOTE MAKER"
        placeholder="Your page name">

    </div>

    <!-- FONT -->
    <div class="section">

        <label>Font</label>

        <select id="fontSelect">

            <option value="Noto Sans Devanagari">
                Hindi / Devanagari
            </option>

            <option value="Inter">
                Modern
            </option>

            <option value="Georgia">
                Classic
            </option>

            <option value="Arial">
                Clean
            </option>

        </select>

    </div>

    <!-- SIZE -->
    <div class="section">

        <label>
            Font Size
            <span class="range-value" id="fontValue">26</span>
        </label>

        <input
        id="fontSize"
        type="range"
        min="16"
        max="55"
        value="26">

    </div>

    <!-- TEXT COLOR -->
    <div class="section">

        <div class="row">

            <div>
                <label>Text Color</label>
                <input id="textColor"
                type="color"
                value="#ffffff">
            </div>

            <div>
                <label>Background</label>
                <input id="bgColor"
                type="color"
                value="#111827">
            </div>

        </div>

    </div>

    <!-- BACKGROUND STYLES -->
    <div class="section">

        <div class="section-title">
            Background Style
        </div>

        <div class="style-grid">

            <button class="style-btn active"
            data-style="gradient"
            style="background:linear-gradient(135deg,#111827,#1d4ed8)">
            </button>

            <button class="style-btn"
            data-style="sunset"
            style="background:linear-gradient(135deg,#7c2d12,#db2777)">
            </button>

            <button class="style-btn"
            data-style="green"
            style="background:linear-gradient(135deg,#064e3b,#15803d)">
            </button>

            <button class="style-btn"
            data-style="purple"
            style="background:linear-gradient(135deg,#312e81,#9333ea)">
            </button>

            <button class="style-btn"
            data-style="dark"
            style="background:#020617">
            </button>

            <button class="style-btn"
            data-style="cream"
            style="background:#fef3c7">
            </button>

            <button class="style-btn"
            data-style="red"
            style="background:linear-gradient(135deg,#450a0a,#dc2626)">
            </button>

            <button class="style-btn"
            data-style="ocean"
            style="background:linear-gradient(135deg,#082f49,#0891b2)">
            </button>

        </div>

    </div>

    <!-- BUTTONS -->

    <div class="section">

        <button
        class="secondary"
        onclick="randomQuote()">
        🎲 Random Quote
        </button>

        <button
        class="success"
        onclick="downloadImage()">
        ⬇️ Download 1080 × 1920
        </button>

        <button
        class="primary"
        onclick="shareQuote()">
        📤 Share
        </button>

        <button
        class="danger"
        onclick="resetApp()">
        ↺ Reset
        </button>

    </div>

</div>


<!-- =========================
     PREVIEW
========================= -->

<div class="preview-area">

    <div class="preview-wrapper">

        <div
        id="canvas"
        class="canvas">

            <div class="quote-container">

                <div class="quote-mark">
                    “
                </div>

                <div
                id="quote"
                class="quote">
                सफलता उन्हीं लोगों को मिलती है जो लगातार प्रयास करते रहते हैं।
                </div>

                <div
                id="author"
                class="author">
                — Your Name
                </div>

            </div>

            <div
            id="brand"
            class="brand">
            QUOTE MAKER
            </div>

        </div>

    </div>

</div>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const quoteInput =
document.getElementById("quoteInput");

const authorInput =
document.getElementById("authorInput");

const brandInput =
document.getElementById("brandInput");

const quote =
document.getElementById("quote");

const author =
document.getElementById("author");

const brand =
document.getElementById("brand");

const canvas =
document.getElementById("canvas");

const fontSize =
document.getElementById("fontSize");

const fontValue =
document.getElementById("fontValue");

const textColor =
document.getElementById("textColor");

const bgColor =
document.getElementById("bgColor");

const fontSelect =
document.getElementById("fontSelect");


/* =========================
   LIVE UPDATE
========================= */

quoteInput.addEventListener("input", () => {

    quote.textContent =
    quoteInput.value;

});

authorInput.addEventListener("input", () => {

    const value =
    authorInput.value.trim();

    author.textContent =
    value ? "— " + value : "";

});

brandInput.addEventListener("input", () => {

    brand.textContent =
    brandInput.value;

});

fontSize.addEventListener("input", () => {

    quote.style.fontSize =
    fontSize.value + "px";

    fontValue.textContent =
    fontSize.value;

});

textColor.addEventListener("input", () => {

    quote.style.color =
    textColor.value;

    author.style.color =
    textColor.value;

});

bgColor.addEventListener("input", () => {

    canvas.style.background =
    bgColor.value;

});


fontSelect.addEventListener("change", () => {

    quote.style.fontFamily =
    fontSelect.value;

    author.style.fontFamily =
    fontSelect.value;

});


/* =========================
   BACKGROUND STYLES
========================= */

const styles = {

    gradient:
    "linear-gradient(135deg,#111827,#1d4ed8)",

    sunset:
    "linear-gradient(135deg,#7c2d12,#db2777)",

    green:
    "linear-gradient(135deg,#064e3b,#15803d)",

    purple:
    "linear-gradient(135deg,#312e81,#9333ea)",

    dark:
    "#020617",

    cream:
    "#fef3c7",

    red:
    "linear-gradient(135deg,#450a0a,#dc2626)",

    ocean:
    "linear-gradient(135deg,#082f49,#0891b2)"

};


document.querySelectorAll(".style-btn")
.forEach(button => {

    button.addEventListener("click", () => {

        document
        .querySelectorAll(".style-btn")
        .forEach(btn =>
            btn.classList.remove("active")
        );

        button.classList.add("active");

        const style =
        button.dataset.style;

        canvas.style.background =
        styles[style];

        /* Improve cream background readability */

        if(style === "cream") {

            quote.style.color = "#111827";
            author.style.color = "#111827";

        } else {

            quote.style.color =
            textColor.value;

            author.style.color =
            textColor.value;

        }

    });

});


/* =========================
   RANDOM QUOTES
========================= */

const quotes = [

    {
        text:
        "सफलता उन्हीं लोगों को मिलती है जो लगातार प्रयास करते रहते हैं।",
        author:
        "अज्ञात"
    },

    {
        text:
        "जो समय की कद्र करता है, समय भी उसकी कद्र करता है।",
        author:
        "अज्ञात"
    },

    {
        text:
        "छोटे कदम भी बड़े बदलाव की शुरुआत हो सकते हैं।",
        author:
        "अज्ञात"
    },

    {
        text:
        "मुश्किल रास्ते अक्सर खूबसूरत मंजिल तक ले जाते हैं।",
        author:
        "अज्ञात"
    },

    {
        text:
        "अपने लक्ष्य पर ध्यान दें, रास्ते की कठिनाइयों पर नहीं।",
        author:
        "अज्ञात"
    },

    {
        text:
        "आज का प्रयास ही कल की सफलता की नींव है।",
        author:
        "अज्ञात"
    },

    {
        text:
        "खुद पर विश्वास रखें, शुरुआत हमेशा छोटी होती है।",
        author:
        "अज्ञात"
    }

];


function randomQuote() {

    const item =
    quotes[
        Math.floor(
            Math.random() *
            quotes.length
        )
    ];

    quoteInput.value =
    item.text;

    authorInput.value =
    item.author;

    quote.textContent =
    item.text;

    author.textContent =
    "— " + item.author;

}


/* =========================
   DOWNLOAD
========================= */

async function downloadImage() {

    const originalWidth =
    canvas.style.width;

    const originalHeight =
    canvas.style.height;

    canvas.style.width =
    "1080px";

    canvas.style.height =
    "1920px";

    canvas.style.borderRadius =
    "0";

    const scale = 3;

    const data =
    await html2canvas(canvas, {

        scale: scale,

        width: 1080,

        height: 1920,

        backgroundColor: null,

        useCORS: true

    });

    const link =
    document.createElement("a");

    link.download =
    "quote-1080x1920.png";

    link.href =
    data.toDataURL("image/png");

    link.click();

    canvas.style.width =
    originalWidth;

    canvas.style.height =
    originalHeight;

    canvas.style.borderRadius =
    "5px";

}


/* =========================
   SHARE
========================= */

async function shareQuote() {

    const text =
    quoteInput.value +
    "\n\n— " +
    authorInput.value;

    if(navigator.share) {

        try {

            await navigator.share({
                title: "Quote",
                text: text
            });

        } catch(e) {}

    } else {

        await navigator.clipboard.writeText(text);

        alert(
            "Quote copied to clipboard."
        );

    }

}


/* =========================
   RESET
========================= */

function resetApp() {

    quoteInput.value =
    "सफलता उन्हीं लोगों को मिलती है जो लगातार प्रयास करते रहते हैं।";

    authorInput.value =
    "Your Name";

    brandInput.value =
    "QUOTE MAKER";

    fontSize.value =
    26;

    fontValue.textContent =
    26;

    textColor.value =
    "#ffffff";

    bgColor.value =
    "#111827";

    quote.textContent =
    quoteInput.value;

    author.textContent =
    "— Your Name";

    brand.textContent =
    "QUOTE MAKER";

    quote.style.fontSize =
    "26px";

    quote.style.color =
    "#ffffff";

    author.style.color =
    "#ffffff";

    quote.style.fontFamily =
    "Noto Sans Devanagari";

    author.style.fontFamily =
    "Noto Sans Devanagari";

    canvas.style.background =
    styles.gradient;

}


/* =========================
   LOAD HTML2CANVAS
========================= */

const script =
document.createElement("script");

script.src =
"https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";

script.onload = () => {

    console.log(
        "Quote Maker ready"
    );

};

document.head.appendChild(script);

</script>

</body>
</html>
